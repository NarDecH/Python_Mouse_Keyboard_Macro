# รัน unit tests อัตโนมัติทุกครั้งที่ push / สร้าง PR
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest          # โปรแกรมนี้เป็น automation บน Windows
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: ตั้งค่า Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: ติดตั้งไลบรารี
        run: |
          python -m pip install --upgrade pip
          pip install pynput

      - name: รัน unit tests
        run: |
          python -m unittest test_auto_macro -v 2>&1 | Tee-Object -FilePath unit_output.txt
          exit $LASTEXITCODE

      # เก็บ output ไว้ใน Step Summary — ดู log ตอนพังได้จากหน้า run โดยไม่ต้องล็อกอิน
      - name: แนบผล unit tests ลง Step Summary
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "### ผล unit tests ($env:PYTHON_VERSION)"
          Add-Content $env:GITHUB_STEP_SUMMARY '```text'
          Get-Content unit_output.txt | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      # E2E: รัน CLI จริง (สคริปต์ Beep ล้วน ปลอดภัย) — หยุดผ่าน stop-file ทั้งหมด
      - name: รัน E2E tests
        run: python -m unittest test_e2e -v
