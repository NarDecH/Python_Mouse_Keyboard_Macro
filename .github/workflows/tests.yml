# รัน unit tests อัตโนมัติทุกครั้งที่ push / สร้าง PR
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest          # โปรแกรมนี้เป็น automation บน Windows
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: ตั้งค่า Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: ติดตั้งไลบรารี
        run: |
          python -m pip install --upgrade pip
          pip install pynput

      - name: รัน unit tests
        run: python -m unittest test_auto_macro -v

      # E2E: รัน CLI จริง (สคริปต์ Beep ล้วน ปลอดภัย) — หยุดผ่าน stop-file ทั้งหมด
      - name: รัน E2E tests
        run: python -m unittest test_e2e -v
